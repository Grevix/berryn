name: Publish Berryn to npm

# Triggers ONLY on version tags: v0.1.0, v0.2.0, v1.0.0, etc.
# Never triggers on branch pushes — CI is separate (ci.yml).
on:
  push:
    tags:
      - "v*"

# id-token: write is required for npm Trusted Publishing (OIDC).
# contents: read is sufficient for checkout.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Validation gates ─────────────────────────────────────────────────────

      - name: Run tests
        run: pnpm test

      - name: Build monorepo packages
        run: pnpm run build

      - name: Typecheck TypeScript packages
        run: pnpm run typecheck

      - name: Run CLI smoke test
        run: node packages/cli/dist/index.js inspect . --project --format markdown

      - name: Security audit
        run: pnpm audit --audit-level=high

      # ── Version gate: git tag must match packages/cli/package.json version ───

      - name: Verify tag matches CLI package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Package version : $PKG_VERSION"
          echo "Git tag version : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      # ── Package content inspection ───────────────────────────────────────────

      - name: Inspect npm packages (dry run)
        run: pnpm publish -r --no-git-checks --dry-run

      # ── Publish via OIDC Trusted Publishing ──────────────────────────────────
      #
      # id-token: write permission provides OIDC identity to npm Trusted Publishing.
      # --provenance binds build attestation.
      # --access public ensures scoped @berryn/* packages publish publicly.
      # pnpm publish -r publishes all workspace packages in topological order
      # and converts workspace:* dependency specifiers to exact version 0.1.0.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publish to npm
        run: pnpm publish -r --no-git-checks --provenance --access public
