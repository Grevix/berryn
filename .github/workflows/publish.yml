name: Publish Berryn to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # ── Environment & Registry Verification (No Secrets Printed) ─────────────
      - name: Print Registry & Environment Configuration
        run: |
          echo "=== Registry Configuration ==="
          npm config get registry
          npm config get @berryn:registry || true
          echo "=== Environment Versions ==="
          node --version
          pnpm --version
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Validation Gates ─────────────────────────────────────────────────────

      - name: Run tests
        run: pnpm test

      - name: Build monorepo packages
        run: pnpm run build

      - name: Typecheck TypeScript packages
        run: pnpm run typecheck

      - name: Run CLI smoke test
        run: node packages/cli/dist/index.js inspect . --project --format markdown

      - name: Security audit
        run: pnpm audit --audit-level=high

      # ── Version Gate: Verify all workspace packages match tag version ─────────

      - name: Verify package version matches git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Git Tag Version  : $TAG_VERSION"
          echo "CLI Version      : $CLI_VERSION"
          if [ "$CLI_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Git tag $GITHUB_REF_NAME does not match CLI version $CLI_VERSION"
            exit 1
          fi

          node -e "
          const fs = require('fs');
          const path = require('path');
          const tag = '${TAG_VERSION}';
          const dirs = fs.readdirSync('packages').map(d => path.join('packages', d, 'package.json')).filter(p => fs.existsSync(p));
          dirs.forEach(f => {
            const v = JSON.parse(fs.readFileSync(f, 'utf8')).version;
            if (v !== tag) {
              console.error('❌ Version mismatch in ' + f + ': ' + v + ' != ' + tag);
              process.exit(1);
            }
          });
          console.log('✅ All 15 workspace packages consistently match version ' + tag);
          "

      # ── Dry-Run Inspection ───────────────────────────────────────────────────

      - name: Inspect npm packages (dry run)
        run: pnpm publish -r --no-git-checks --dry-run

      # ── Publish via OIDC Trusted Publishing ──────────────────────────────────
      #
      # permissions: id-token: write enables OIDC identity for npm Trusted Publishing.
      # publishConfig in package.json ensures target is https://registry.npmjs.org/.
      # --provenance binds signed build attestation.
      # --access public ensures scoped @berryn/* packages publish publicly.
      # pnpm publish -r publishes all packages in topological dependency order
      # and skips packages that already exist on registry.npmjs.org.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publish all packages to npm
        run: pnpm publish -r --no-git-checks --provenance --access public
